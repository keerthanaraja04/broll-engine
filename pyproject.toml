[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broll-engine"
version = "0.1.0"
description = "B-roll video generation engine powered by Groq and Pixabay"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Settings & validation
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    # Database
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    # Cache / queue
    "redis==5.0.4",
    "arq==0.25.0",
    # Object storage
    "boto3==1.34.101",
    "minio==7.2.7",
    # HTTP client
    "httpx==0.27.0",
    # Logging
    "python-json-logger==2.0.7",
    # CLI
    "typer==0.12.3",
    "rich==13.7.1",
    # Utilities
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "tenacity==8.3.0",
    "structlog==24.1.0",
    # JSON Schema validation for LLM adapter
    "jsonschema==4.22.0",
    # YAML for OpenAPI spec generation
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-httpx==0.30.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "factory-boy==3.3.0",
    "faker==25.2.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    # In-memory SQLite for integration tests (no live Postgres needed)
    "aiosqlite==0.20.0",
]

[project.scripts]
broll = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__init__.py"]
